[package]
name = "elevenpad"
version = "0.4.2"
edition = "2021"
description = "A Windows 11 Notepad reimplementation for Linux, written in Rust with egui"
license = "MIT"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["wgpu", "default_fonts", "persistence", "x11", "wayland"] }
egui = "0.29"
egui-wgpu = "0.29"
wgpu = "22"
pollster = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
chrono = "0.4"

[[bin]]
name = "elevenpad"
path = "src/main.rs"

[[bin]]
name = "probe"
path = "src/bin/probe.rs"

[[bin]]
name = "shot"
path = "src/bin/shot.rs"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["shape"] }

[profile.release]
opt-level = 2
